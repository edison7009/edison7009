<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" role="img" aria-label="edison7009 — building software for a longer, better life">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07191d"/>
      <stop offset="1" stop-color="#0d2a25"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a066"/>
      <stop offset="0.55" stop-color="#b98b54"/>
      <stop offset="1" stop-color="#7fc8a9"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>

  <!-- tree signature -->
  <g stroke="#7fc8a9" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M96 430 V 96"/>
    <path d="M96 96 C 96 82, 82 70, 66 76"/>
    <path d="M96 96 C 96 82, 110 70, 126 76"/>
    <path d="M96 128 C 96 114, 78 104, 60 110"/>
    <path d="M96 128 C 96 114, 114 104, 132 110"/>
    <path d="M96 160 C 96 146, 80 138, 64 144"/>
    <path d="M96 160 C 96 146, 112 138, 128 144"/>
    <path d="M96 192 H 66"/>
    <path d="M96 192 H 126"/>
  </g>

  <!-- name -->
  <text x="150" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="7" fill="#e8e2d3">EDISON 7009</text>
  <text x="151" y="151" font-family="'Courier New', monospace" font-size="12" letter-spacing="4.5" fill="#7fc8a9">INDEPENDENT BUILDER · OPEN SOURCE</text>

  <!-- mission -->
  <text x="150" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="52" letter-spacing="1" fill="#f3efe4">Software for a longer, better life.</text>
  <text x="150" y="372" font-family="'Courier New', monospace" font-size="15" letter-spacing="5" fill="#d9a066">让科学延寿，不应该是富豪专属。</text>

  <!-- ventures -->
  <g font-family="'Courier New', monospace" font-size="13" letter-spacing="2">
    <text x="150" y="452" fill="#7fc8a9">01</text>
    <text x="193" y="452" fill="#e8e2d3">ECHOBIRD</text>
    <text x="452" y="452" fill="#7fc8a9">02</text>
    <text x="495" y="452" fill="#e8e2d3">COFFEE-CLI</text>
    <text x="752" y="452" fill="#7fc8a9">03</text>
    <text x="795" y="452" fill="#e8e2d3">TIERVIBE</text>
    <text x="1052" y="452" fill="#7fc8a9">04</text>
    <text x="1095" y="452" fill="#e8e2d3">OPEN LONGEVITY</text>
  </g>

  <!-- copper line -->
  <path d="M150 470 H 1450" stroke="url(#line)" stroke-width="1" opacity="0.8"/>
  <circle cx="150" cy="470" r="3" fill="#d9a066"/>
  <circle cx="1450" cy="470" r="3" fill="#7fc8a9"/>
</svg>
